name: Publicar notebooks no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "notebooks/**"
      - ".github/workflows/publish-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy notebooks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar conversor de notebooks
        run: python -m pip install "nbconvert==7.*"

      - name: Renderizar notebooks
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from html import escape
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          source = Path("notebooks")
          public = Path("public")

          if public.exists():
              shutil.rmtree(public)
          public.mkdir(parents=True)
          (public / ".nojekyll").touch()

          def cell_source(cell):
              source = cell.get("source", "")
              if isinstance(source, list):
                  return "".join(source)
              return source

          def notebook_metadata(path):
              data = json.loads(path.read_text(encoding="utf-8"))
              title = data.get("metadata", {}).get("title")
              description = ""

              for cell in data.get("cells", []):
                  if cell.get("cell_type") != "markdown":
                      continue

                  text = cell_source(cell)
                  for line in text.splitlines():
                      stripped = line.strip()
                      if not stripped:
                          continue
                      if stripped.startswith("#") and not title:
                          title = stripped.lstrip("#").strip()
                          continue
                      if not stripped.startswith("#") and not stripped.startswith("!"):
                          description = stripped
                          break

                  if title and description:
                      break

              if not title:
                  title = path.stem.replace("_", " ").replace("-", " ").title()

              return title, description

          for asset in source.rglob("*"):
              if not asset.is_file() or asset.suffix == ".ipynb":
                  continue

              destination = public / asset.relative_to(source)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(asset, destination)

          notebooks = sorted(source.rglob("*.ipynb"))
          pages = []

          for notebook in notebooks:
              relative = notebook.relative_to(source)
              output_dir = public / relative.parent
              output_dir.mkdir(parents=True, exist_ok=True)

              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "jupyter",
                      "nbconvert",
                      "--to",
                      "html",
                      "--template",
                      "lab",
                      "--output-dir",
                      str(output_dir),
                      str(notebook),
                  ],
                  check=True,
              )

              title, description = notebook_metadata(notebook)
              html_path = relative.with_suffix(".html").as_posix()
              pages.append((html_path, title, description))

          cards = "\n".join(
              f"""      <article>
                <h2><a href="{escape(path)}">{escape(title)}</a></h2>
                <p>{escape(description or "Notebook renderizado em HTML.")}</p>
              </article>"""
              for path, title, description in pages
          )

          if not cards:
              cards = "      <p>Nenhum notebook encontrado em notebooks/.</p>"

          (public / "index.html").write_text(f"""<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Notebooks</title>
            <style>
              body {{
                background: #f6f8fa;
                color: #1f2328;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.5;
                margin: 0;
              }}
              main {{
                margin: 0 auto;
                max-width: 960px;
                padding: 3rem 1rem;
              }}
              h1 {{
                font-size: 2.25rem;
                margin: 0 0 0.5rem;
              }}
              .intro {{
                color: #57606a;
                margin: 0 0 2rem;
              }}
              .grid {{
                display: grid;
                gap: 1rem;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
              }}
              article {{
                background: #ffffff;
                border: 1px solid #d0d7de;
                border-radius: 8px;
                padding: 1rem;
              }}
              h2 {{
                font-size: 1.1rem;
                margin: 0 0 0.5rem;
              }}
              p {{
                margin: 0;
              }}
              a {{
                color: #0969da;
                text-decoration-thickness: 0.08em;
                text-underline-offset: 0.16em;
              }}
            </style>
          </head>
          <body>
            <main>
              <h1>Notebooks</h1>
              <p class="intro">Conteudo dos notebooks convertido para paginas HTML.</p>
              <section class="grid">
          {cards}
              </section>
            </main>
          </body>
          </html>
          """, encoding="utf-8")
          PY

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
